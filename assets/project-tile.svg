<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title description">
  <title id="title">iDPRT S1 BLE label printer</title>
  <desc id="description">A dark burgundy project banner with a thermal label illustration and Bluetooth waves.</desc>
  <defs>
